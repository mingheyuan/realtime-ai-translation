<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>悬浮字幕</title>
    <link rel="stylesheet" href="/overlay.css" />
  </head>
  <body>
    <main class="overlay-shell">
      <header class="drag-bar" aria-label="拖动区域">
        <span class="live-dot"></span>
        <span id="overlay-status">正在连接实时翻译</span>
        <div class="overlay-controls" aria-label="翻译控制">
          <button class="overlay-start" id="overlay-start" type="button">开始</button>
          <button class="overlay-stop" id="overlay-stop" type="button" disabled>停止</button>
        </div>
      </header>
      <div class="settings-bar" aria-label="翻译设置">
        <label for="overlay-asr">ASR</label>
        <select id="overlay-asr">
          <option value="apple_speech">Apple Speech</option>
          <option value="sherpa_onnx">Sherpa-ONNX（未配置）</option>
        </select>
        <label for="overlay-audio">输入</label>
        <select id="overlay-audio">
          <option value="microphone">麦克风</option>
          <option value="system_audio">系统音频</option>
        </select>
        <label for="overlay-direction">方向</label>
        <button class="direction-button" id="overlay-direction" type="button">中 → 英</button>
        <span class="settings-hint">右侧斜纹缩放 · 运行中需先停止才能切换</span>
      </div>
      <section class="caption-stack" id="caption-stack" aria-live="polite">
        <article class="caption-card waiting" id="waiting-card">
          <div class="waiting-wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
          <span>等待语音输入…</span>
        </article>
      </section>
    </main>
    <script src="/overlay.js"></script>
  </body>
</html>
